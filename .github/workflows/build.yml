name: Build and Test

on:
 # every branch is built as it is pushed, so work is checked before it reaches main, which moves only after review.
 push:
 pull_request:

permissions:
 contents: read

jobs:
 build-and-test:
  # HexIDE's add-in contract and its UI (Avalonia) are cross-platform, so everything builds and tests on Linux. The platform
  # RDCore.PlatformInstaller deploys is a zip on Windows and a tar.gz on Linux and macOS, and both are tested on each system;
  # the tests of what only Windows does on disk, refusing to rename a folder with a file open in it, run on Windows only.
  # linux-x64, win-x64 and osx-x64 (macos-15-intel, GitHub's Intel image) run for every push and pull request; osx-arm64
  # (macos-latest) runs on main only, where it is too slow to hold work up.
  strategy:
   fail-fast: false
   matrix:
    os: ${{ fromJSON(github.event_name == 'push' && github.ref == 'refs/heads/main' && '["ubuntu-latest", "windows-latest", "macos-15-intel", "macos-latest"]' || '["ubuntu-latest", "windows-latest", "macos-15-intel"]') }}
  runs-on: ${{ matrix.os }}

  steps:
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false

   - name: Setup .NET
     uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
     with:
      dotnet-version: 10.0

   - name: Dependencies
     shell: pwsh
     run: ./tools/Get-Dependencies.ps1

   - name: Build (Debug)
     run: dotnet build RDCore.HexIDE.slnx --configuration Debug

   - name: Test (Debug)
     run: dotnet test RDCore.HexIDE.slnx --configuration Debug --no-build --verbosity normal

   - name: Build (Release)
     run: dotnet build RDCore.HexIDE.slnx --configuration Release

   - name: Test (Release)
     run: dotnet test RDCore.HexIDE.slnx --configuration Release --no-build --verbosity normal

   - name: Package (unsigned)
     if: matrix.os == 'windows-latest'
     shell: pwsh
     run: ./tools/Pack-Addin.ps1

   - name: Upload the package
     if: matrix.os == 'windows-latest'
     uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
     with:
      name: rdcore-addin-unsigned
      path: artifacts/addins/rdcore
      retention-days: 14
